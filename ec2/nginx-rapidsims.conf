# HTTP bootstrap example only; preserve the existing TLS server in production.
# Generate /etc/nginx/rapidsims-locations.conf with:
#   node ec2/render-nginx.js --locations
# This zone belongs in the http context and must be declared exactly once.
limit_req_zone $binary_remote_addr zone=rapid_auth:10m rate=5r/s;
server {
    listen 80;
    server_name rapidsims.flexee.org;
    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    include /etc/nginx/rapidsims-locations.conf;
}

