# Install as /etc/nginx/conf.d/rapidsims.conf, then nginx -t && systemctl reload nginx.
# Replace the sample server_name with the EC2 DNS name or your domain.
server {
    listen 80;
    server_name rapidsims.flexee.org;

    client_max_body_size 5m;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sim01 { return 308 /sim01/; }
    location ^~ /sim01/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_cookie_path / /sim01/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /sim01;
    }

    location = /sim02 { return 308 /sim02/; }
    location ^~ /sim02/ {
        proxy_pass http://127.0.0.1:3102/;
