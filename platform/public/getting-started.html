<script>
// The public copy of Getting started, for invitation emails (the same text as the faculty menu's page).
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/guide').then(r=>r.ok?r.json():null).then(d=>{document.getElementById('guide').innerHTML=d?String(d.text).split(/\n{2,}/).map(b=>b.startsWith('# ')?`<h1>${esc(b.slice(2))}</h1>`:b.startsWith('## ')?`<h3>${esc(b.slice(3))}</h3>`:`<p>${esc(b).replace(/\n/g,' ')}</p>`).join(''):'<p class="hint">Getting started is not available right now.</p>'});
</script></body></html>
