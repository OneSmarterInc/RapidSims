<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your account — Flexee RapidSims</title>
<link rel="stylesheet" href="/app.css">
<script src="/portal-navigation.js"></script>
</head>
<body>
<div class="bar">
  <div class="brand">Flexee <span>RapidSims</span></div>
  <div class="who" id="who"></div>
  <button class="btn sm" id="back">Back</button>
  <button class="btn sm" id="out">Sign out</button>
</div>
<div class="narrow" id="app"></div>

<div class="narrow"><div class="foot-note">
  <span>&copy; 2026 Flexee LLC. All rights reserved.</span>
  <span><a href="mailto:support@flexee.org">support@flexee.org</a></span>
</div></div>
<script>
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path, payload) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.message || d.error || 'HTTP ' + r.status); e.body = d; e.status = r.status; if (r.status === 401 && payload.action !== 'signin') PortalNavigation.signin(); throw e; }
  return d;
}
document.getElementById('out').onclick = async () => { await api('/api/auth', { action:'signout' }); location.href = '/'; };

(async () => {
  let me;
  try {
    me = (await api('/api/auth', { action:'me' })).user;
    if (!me) { PortalNavigation.signin(); return; }
  } catch (e) { PortalNavigation.failure(app, e, () => location.reload()); return; }
  const home = me.role === 'admin' ? '/admin.html' : me.role === 'faculty' ? '/faculty.html' : '/student.html';
  document.getElementById('who').textContent = me.name;
  document.getElementById('back').onclick = () => location.href = PortalNavigation.safeReturn(new URLSearchParams(location.search).get('next'), me.role);

  const roleWord = me.role === 'admin' ? 'Administrator' : me.role === 'faculty' ? 'Facilitator' : 'Student';

  app.innerHTML =
    '<div class="eyebrow">Your account</div><h1>' + esc(me.name) + '</h1>' +
    '<p class="lede">' + esc(roleWord) + ' · signed in as ' + esc(me.email) + '</p>' +

    '<div class="card" style="margin-top:24px">' +
      '<h2 style="margin-top:0">Your details</h2>' +
      '<div class="field"><label class="f">Name</label><input id="pn" type="text" value="' + esc(me.name) + '"></div>' +
      '<div class="field"><label class="f">Email</label>' +
        '<input type="email" value="' + esc(me.email) + '" disabled style="background:var(--sunk);color:var(--ink3)">' +
        '<div class="tiny dim" style="margin-top:5px">Your email is how you sign in and cannot be changed here.</div></div>' +
      (me.role !== 'student'
        ? '<div class="field"><label class="f">Institution</label><input id="pi" type="text" value="' + esc(me.institution || '') + '" placeholder="optional"></div>'
        : '') +
      '<button class="btn pri" id="psave">Save changes</button>' +
      '<div id="pout"></div>' +
    '</div>' +

    '<div class="card">' +
      '<h2 style="margin-top:0">Change your password</h2>' +
      '<div class="field"><label class="f">Current password</label><input id="c" type="password" autocomplete="current-password"></div>' +
      '<div class="field"><label class="f">New password</label><input id="n" type="password" autocomplete="new-password" placeholder="at least 8 characters"></div>' +
      '<button class="btn pri" id="go">Change it</button>' +
      '<div id="out2"></div>' +
    '</div>' +
    '<div class="note">Changing your password signs you out of any other browser you are signed in on.</div>';

  document.getElementById('psave').onclick = async () => {
    const btn = document.getElementById('psave'), out = document.getElementById('pout');
    btn.disabled = true; btn.textContent = 'Saving…';
    out.innerHTML = '';
    try {
      const pi = document.getElementById('pi');
      const d = await api('/api/auth', { action:'update_profile',
        name: document.getElementById('pn').value,
        institution: pi ? pi.value : undefined });
      document.getElementById('who').textContent = d.user.name;
      out.innerHTML = '<div class="ok">Saved.</div>';
    } catch (e) { out.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    btn.disabled = false; btn.textContent = 'Save changes';
  };

  document.getElementById('go').onclick = async () => {
    const btn = document.getElementById('go'), out = document.getElementById('out2');
    btn.disabled = true; btn.textContent = 'Changing…';
    out.innerHTML = '';
    try {
      await api('/api/auth', { action:'change_password',
        currentPassword: document.getElementById('c').value,
        newPassword: document.getElementById('n').value });
      out.innerHTML = '<div class="ok">Done. Your new password is in use.</div>';
      document.getElementById('c').value = ''; document.getElementById('n').value = '';
    } catch (e) { out.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    btn.disabled = false; btn.textContent = 'Change it';
  };
})();
</script>
</body>
</html>
