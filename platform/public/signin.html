<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Flexee RapidSims</title>
<link rel="stylesheet" href="/app.css">
<style>
  .hero{padding:60px 0 8px}
  .hero h1{font-size:52px;line-height:1.05;margin-bottom:18px}
  .hero .lede{font-size:19px;max-width:56ch}
  .split{display:grid;grid-template-columns:1fr 340px;gap:40px;align-items:start}
  .simcard{border:1px solid var(--line);background:var(--card);padding:24px 26px;margin-bottom:14px}
  .simcard h3{font-size:22px;font-weight:400;letter-spacing:-.015em;margin-bottom:6px}
  .simcard .tag{color:var(--amber);font-style:italic;font-size:16px;margin-bottom:12px}
  .simcard p{font-size:15.5px;line-height:1.62;max-width:62ch;margin-bottom:0}
  .simcard .meta{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:14px}
  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:8px}
  .how h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:7px}
  .how p{font-size:14.5px;line-height:1.6;margin:0}
  @media (max-width:860px){.split{grid-template-columns:1fr}.hero h1{font-size:36px}.how{grid-template-columns:1fr}}
</style>
<script src="/sim-identity.js"></script>
<script src="/portal-navigation.js"></script>
</head>
<body>
<div class="narrow" id="app"></div>

<div class="narrow"><div class="foot-note">
  <span>&copy; 2026 Flexee LLC. All rights reserved.</span>
  <span><a href="mailto:support@flexee.org">support@flexee.org</a></span>
</div></div>
<script>
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, payload) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.message || d.error || 'HTTP ' + r.status); e.body = d; e.status = r.status; if (r.status === 401 && payload.action !== 'signin') PortalNavigation.signin(); throw e; }
  return d;
}
const simLabel = (x) => RapidSimsIdentity.label(x) + ' — ' + x.title;
const home = r => r === 'admin' ? '/admin.html' : r === 'faculty' ? '/faculty.html' : '/student.html';

function page(msg) {
  app.innerHTML = `
    <div class="eyebrow" style="margin-top:40px">Flexee RapidSims</div>
    <h1>Sign <em>in</em></h1>
    <div class="card" style="margin-top:26px">
      <div class="field"><label class="f" for="em">Email</label>
        <input id="em" type="email" autocomplete="username" placeholder="you@university.edu"></div>
      <div class="field"><label class="f" for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password"></div>
      <button class="btn pri" id="go">Sign in</button>
      <div class="err" id="err">${msg ? esc(msg) : ''}</div>
      <div class="tiny dim" style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px">
        <b>Students:</b> use the link your instructor sent you — you do not need an account first.
        <div style="margin-top:8px"><a href="/join.html">Or enter a course code</a></div>
      </div>
      <div class="tiny dim" style="margin-top:12px">Forgotten your password? Ask whoever set up your account for a reset link.</div>
    </div>
    <p class="tiny dim" style="margin-top:20px"><a href="/">← See what the simulations are</a></p>`;

  const go = async () => {
    const btn = document.getElementById('go');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const d = await api('/api/auth', { action:'signin',
        email: document.getElementById('em').value, password: document.getElementById('pw').value });
      location.replace(PortalNavigation.safeReturn(new URLSearchParams(location.search).get('next'), d.user.role));
    } catch (e) {
      document.getElementById('err').textContent = e.message;
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };
  document.getElementById('go').onclick = go;
  ['em','pw'].forEach(k => document.getElementById(k).onkeydown = e => { if (e.key === 'Enter') go(); });
  document.getElementById('em').focus();
}

(async () => {
  try {
    const d = await api('/api/auth', { action:'me' });
    if (d.user) { location.replace(PortalNavigation.safeReturn(new URLSearchParams(location.search).get('next'), d.user.role)); return; }
  } catch (e) {
    if (e.body && e.body.error === 'no_db') {
      app.innerHTML = '<div class="hero"><div class="eyebrow">Flexee RapidSims</div>' +
        '<h1>Not set up yet</h1><p class="lede">This deployment has no database configured.</p></div>';
      return;
    }
  }
  page();
})();
</script>
</body>
</html>
