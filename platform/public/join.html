<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join your course — Flexee RapidSims</title>
<link rel="stylesheet" href="/app.css">
<script src="/portal-navigation.js"></script>
</head>
<body>
<div class="narrow" id="app"></div>

<div class="narrow"><div class="foot-note">
  <span>&copy; 2026 Flexee LLC. All rights reserved.</span>
  <span><a href="mailto:support@flexee.org">support@flexee.org</a></span>
</div></div>
<script>
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let code = (new URLSearchParams(location.search).get('c') || '').toUpperCase();

async function api(path, payload) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.message || d.error || 'HTTP ' + r.status); e.body = d; e.status = r.status; if (r.status === 401 && payload.action !== 'signin') PortalNavigation.signin(); throw e; }
  return d;
}

function askCode(msg) {
  app.innerHTML = `
    <div class="eyebrow">Flexee RapidSims</div>
    <h1>Join your <em>course</em></h1>
    <p class="lede">Your instructor gave you a six-character code. Enter it and you're in.</p>
    <div class="card" style="margin-top:26px">
      <div class="field"><label class="f">Course code</label>
        <input id="cc" type="text" placeholder="ABC123" style="text-transform:uppercase;font-family:var(--mono);letter-spacing:.1em"></div>
      <button class="btn pri" id="go">Continue</button>
      <div class="err">${msg ? esc(msg) : ''}</div>
    </div>`;
  const go = () => { const v = document.getElementById('cc').value.trim().toUpperCase(); if (v) { code = v; const url = new URL(location.href); url.searchParams.set('c', code); history.replaceState(null, '', url.pathname + url.search); start(); } };
  document.getElementById('go').onclick = go;
  document.getElementById('cc').onkeydown = e => { if (e.key === 'Enter') go(); };
  document.getElementById('cc').focus();
}

async function start() {
  let info;
  try { info = await api('/api/student', { action:'course_lookup', joinCode: code }); }
  catch (e) { return askCode("We don't recognise that course code. Check it with your instructor."); }

  const c = info.course;
  let me = null;
  try { me = (await api('/api/auth', { action:'me' })).user; } catch (e) {}

  if (me && me.role === 'student') {
    app.innerHTML = `
      <div class="eyebrow">Flexee RapidSims</div>
      <h1>${esc(c.title)}</h1>
      <p class="lede">${esc(c.faculty_name)}${c.term ? ' · ' + esc(c.term) : ''}</p>
      <div class="card"><p>You're signed in as <b>${esc(me.name)}</b>.</p>
        <button class="btn pri" id="join">Join this course</button><div class="err" id="err"></div></div>`;
    document.getElementById('join').onclick = async () => {
      try { await api('/api/student', { action:'enrol', joinCode: code }); location.href = '/student.html'; }
      catch (e) { document.getElementById('err').textContent = e.message; }
    };
    return;
  }

  app.innerHTML = `
    <div class="eyebrow">You've been invited to</div>
    <h1>${esc(c.title)}</h1>
    <p class="lede">${esc(c.faculty_name)}${c.institution ? ', ' + esc(c.institution) : ''}${c.term ? ' · ' + esc(c.term) : ''}</p>
    <div class="card" style="margin-top:24px">
      <div class="field"><label class="f">Your name</label><input id="n" type="text" placeholder="as your instructor knows it"></div>
      <div class="field"><label class="f">Email</label><input id="e" type="email" autocomplete="username"></div>
      <div class="field"><label class="f">Choose a password</label><input id="p" type="password" autocomplete="new-password" placeholder="at least 8 characters"></div>
      <button class="btn pri" id="go">Join the course</button>
      <div class="err" id="err"></div>
    </div>
    <div class="note">Joining is free. Your instructor releases access to each simulation once your registration is settled.</div>`;

  const go = async () => {
    const btn = document.getElementById('go');
    btn.disabled = true; btn.textContent = 'Joining…';
    try {
      await api('/api/student', { action:'signup_and_enrol', joinCode: code,
        name: document.getElementById('n').value,
        email: document.getElementById('e').value,
        password: document.getElementById('p').value });
      location.href = '/student.html';
    } catch (e) {
      document.getElementById('err').textContent = e.message;
      btn.disabled = false; btn.textContent = 'Join the course';
    }
  };
  document.getElementById('go').onclick = go;
  document.getElementById('p').onkeydown = e => { if (e.key === 'Enter') go(); };
  document.getElementById('n').focus();
}

code ? start() : askCode();
</script>
</body>
</html>
