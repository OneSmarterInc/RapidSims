<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instructor transcript</title><style>body{margin:0;background:#f4f6f8;color:#17202a;font:15px/1.5 system-ui,sans-serif}main{max-width:1050px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #d9dee7;border-radius:10px;padding:20px;margin:14px 0}input,button{padding:10px;border:1px solid #ccd3dd;border-radius:7px;font:inherit}button{background:#185adb;color:#fff;border:0}.turn{border-top:1px solid #e3e6eb;padding:14px 0}.meta{color:#667085;font-size:13px}.change{color:#b42318;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>Instructor transcript</h1><p>Open a participant run using its run ID.</p><input id="run" placeholder="Run ID"><input id="code" type="password" placeholder="Faculty code"><button id="open">Open</button><p id="err"></p></div><div id="out"></div></main><script>
(()=>{const out=document.getElementById('out'),esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),base=(location.pathname.match(/^\/sim\d+/)||[''])[0];document.getElementById('open').onclick=async()=>{const r=await fetch(base+'/api/instructor',{method:'POST',headers:{'content-type':'application/json','x-faculty-code':document.getElementById('code').value},body:JSON.stringify({runId:document.getElementById('run').value.trim()})}),d=await r.json();if(!r.ok){document.getElementById('err').textContent=d.error||'Unable to load';return}const windows=d.summary.byWindow.map(w=>`<div class="card"><strong>${esc(w.source||w.label)}</strong><div>${w.questions} questions · ${w.secondsUnused}s unused</div><div>Opener: ${esc(w.openerBucket||'—')}</div><div>End posture: ${esc(w.postureEnd||'—')}</div></div>`).join(''),turns=d.transcript.map(t=>`<div class="turn"><strong>${esc(t.sourceName)}</strong><div>Q: ${esc(t.question)}</div><div>A: ${esc(t.answer)}</div><div class="meta">${esc(t.bucket)} · cost ${t.spent}s · ${t.remaining}s left ${t.postureChanged?`<span class="change">· ${esc(t.postureBefore)} → ${esc(t.postureAfter)}</span>`:''}</div></div>`).join(''),review=d.review?`<div class="card"><h2>Report review</h2><p>${esc(d.review.rootCause)}</p><p>Harm: <strong>${d.review.harmFired?'Yes':'No'}</strong> · feedback-loop evidence: <strong>${d.review.evidence.loopAvailable?'Yes':'No'}</strong></p></div>`:'<div class="card">Report not submitted.</div>';out.innerHTML=`<div class="grid">${windows}</div><div class="card"><h2>Transcript</h2>${turns||'No questions yet.'}</div>${review}`}})();
</script></body></html>
