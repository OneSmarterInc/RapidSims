name: session-sims-checks

on:
  pull_request:
    paths:
      - 'platform/api/launch.js'
      - 'platform/api/student.js'
      - 'platform/api/faculty.js'
      - 'platform/public/faculty.html'
      - 'platform/tools/course-catalogue-check.js'
      - 'platform/api/session-enrolments.js'
      - 'platform/lib/**'
      - 'platform/public/session-entry.js'
      - 'platform/tools/session-sims-check.js'
      - 'platform/tools/new-sims-entry-*.js'
      - 'platform/tools/new-sims-registration-check.js'
      - 'sim07/**'
      - 'sim08/**'
      - 'sim09/**'
      - 'sim10/**'
      - '.github/workflows/session-sims-checks.yml'
  push:
    branches: [main]
    paths:
      - 'platform/api/launch.js'
      - 'platform/api/student.js'
      - 'platform/api/faculty.js'
      - 'platform/public/faculty.html'
      - 'platform/tools/course-catalogue-check.js'
      - 'platform/api/session-enrolments.js'
      - 'platform/lib/**'
      - 'platform/public/session-entry.js'
      - 'platform/tools/session-sims-check.js'
      - 'platform/tools/new-sims-entry-*.js'
      - 'platform/tools/new-sims-registration-check.js'
      - 'sim07/**'
      - 'sim08/**'
      - 'sim09/**'
      - 'sim10/**'
      - '.github/workflows/session-sims-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Platform launch, course lookup and faculty roster
        run: node platform/tools/session-sims-check.js
      - name: Sim07, Sim08 and Sim09 client entry and completion
        run: node platform/tools/new-sims-entry-check.js
      - name: Sim07, Sim08 and Sim09 catalogue registration lifetime
        run: node platform/tools/new-sims-registration-check.js
      - name: Course catalogue refresh and published simulation assignment
        run: node platform/tools/course-catalogue-check.js
