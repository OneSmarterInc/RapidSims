name: sim06-checks

on:
  pull_request:
    paths:
      - 'sim06/**'
      - '.github/workflows/sim06-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'sim06/**'
      - '.github/workflows/sim06-checks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim06
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scenario tests
        run: npm test
