name: sim08-checks

on:
  pull_request:
    paths:
      - 'sim08/**'
      - '.github/workflows/sim08-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'sim08/**'
      - '.github/workflows/sim08-checks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim08
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The checks load shared code (ec2/redis-command.js) that needs the root packages.
      - name: Install root packages
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Scenario tests
        run: npm test
      - name: Production guards
        run: npm run build
