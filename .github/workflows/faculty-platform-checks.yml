name: faculty-platform-checks

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/faculty-platform-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'platform/**'
      - '.github/workflows/faculty-platform-checks.yml'

permissions:
  contents: read

jobs:
  faculty-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify faculty student-wise progress/results
        run: node platform/tools/check-faculty-student-results.js

  faculty-simulation-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated database and browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/faculty-results" --no-audit --no-fund @electric-sql/pglite@0.5.8 playwright@1.62.1
          "$RUNNER_TEMP/faculty-results/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify faculty simulation results against PostgreSQL and browser
        run: |
          export NODE_PATH="$RUNNER_TEMP/faculty-results/node_modules"
          node platform/tools/faculty-sim-results-check.js --browser
