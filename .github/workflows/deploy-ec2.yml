name: Deploy RapidSims to EC2

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

concurrency:
  group: rapidsims-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: bash -n ec2/deploy.sh
  deploy:
    needs: verify
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

    steps:
      - name: Check required deployment settings
        shell: bash
        run: |
          test -n "$AWS_REGION" || { echo "Set the AWS_REGION repository variable."; exit 1; }
          test -n "$EC2_INSTANCE_ID" || { echo "Set the EC2_INSTANCE_ID repository variable."; exit 1; }
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo "Set the AWS_DEPLOY_ROLE_ARN repository variable."; exit 1; }

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy tested commit through Systems Manager
        shell: bash
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY' > /tmp/rapidsims-ssm-parameters.json
          import json, os, re
          sha = os.environ['DEPLOY_COMMIT']
          if not re.fullmatch(r'[a-f0-9]{40}', sha):
              raise ValueError('Invalid deployment SHA')
          command = """#!/usr/bin/env bash
          set -euo pipefail
          sudo -u rapidsims env HOME=/var/lib/rapidsims git -C /var/www/rapidsims fetch origin master
          sudo -u rapidsims git -C /var/www/rapidsims cat-file -e RELEASE_SHA^{commit}
          sudo -u rapidsims git -C /var/www/rapidsims archive RELEASE_SHA ec2/deploy.sh | tar -xO | sudo bash -s -- RELEASE_SHA /var/www/rapidsims
          """
          command = command.replace('RELEASE_SHA', sha)
          print(json.dumps({"commands": [command], "executionTimeout": ["3600"]}))
          PY

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "RapidSims production deploy ${DEPLOY_COMMIT}" \
            --timeout-seconds 600 \
            --parameters file:///tmp/rapidsims-ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM deployment command: $command_id"

          for attempt in $(seq 1 360); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Timed out waiting for the EC2 deployment. Check Systems Manager Run Command history."
          exit 1

