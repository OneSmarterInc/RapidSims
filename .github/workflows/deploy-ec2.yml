name: Deploy RapidSims to EC2

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: rapidsims-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: bash -n ec2/deploy.sh && bash -n ec2/runner-deploy.sh
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Deploy production
    runs-on: [self-hosted, linux, rapidsims-production]
    timeout-minutes: 70
    steps:
      - name: Deploy tested commit locally on EC2
        shell: bash
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/rapidsims-runner-deploy "$DEPLOY_COMMIT"
