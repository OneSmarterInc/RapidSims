name: sim04-checks
on:
  pull_request:
    paths: ['sim04/**', 'platform/lib/session-sims.js', 'platform/lib/catalogue-source.json', 'platform/vercel.json', '.github/workflows/sim04-checks.yml']
  push:
    branches: [main]
    paths: ['sim04/**', 'platform/lib/session-sims.js', 'platform/lib/catalogue-source.json', 'platform/vercel.json', '.github/workflows/sim04-checks.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The tests load shared code (ec2/redis-command.js) that needs the root packages.
      - name: Install root packages
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
