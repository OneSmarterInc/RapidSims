name: sim04-checks
on:
  pull_request:
    paths: ['sim04/**', 'platform/lib/session-sims.js', 'platform/lib/catalogue-source.json', 'platform/vercel.json', '.github/workflows/sim04-checks.yml']
  push:
    branches: [main]
    paths: ['sim04/**', 'platform/lib/session-sims.js', 'platform/lib/catalogue-source.json', 'platform/vercel.json', '.github/workflows/sim04-checks.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run build
