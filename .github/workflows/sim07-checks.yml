name: sim07-checks

on:
  pull_request:
    paths:
      - 'sim07/**'
      - '.github/workflows/sim07-checks.yml'
  push:
    branches: [main]
    paths:
      - 'sim07/**'
      - '.github/workflows/sim07-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Production guards and scenario tests
        run: npm run build
