name: sim03-checks

on:
  pull_request:
    paths:
      - 'sim03/**'
      - '.github/workflows/sim03-checks.yml'
  push:
    branches:
      - main
      - 'feature/sim-03-midland'
    paths:
      - 'sim03/**'
      - '.github/workflows/sim03-checks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install shared runtime dependencies (Redis client used by sim03/lib/store.js)
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Scenario tests
        run: npm test
      - name: Production guards
        run: npm run build
