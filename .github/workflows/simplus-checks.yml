name: RapidSim Plus checks
on:
  push:
    branches: [main, integrate-simplus-01]
    paths:
      - 'sim-plus-01/**'
      - '.github/workflows/simplus-checks.yml'
  pull_request:
    paths:
      - 'sim-plus-01/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim-plus-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The checks load shared code (ec2/redis-command.js) that needs the root packages.
      - name: Install root packages
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run playtest
