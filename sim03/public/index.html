<script id="account-entry-redirect">
(() => {
  const q = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.slice(1));
  if (['localhost', '127.0.0.1'].includes(location.hostname) ||
      q.has('guest') || q.has('lt') || hash.has('lt')) return;
  const entry = new URLSearchParams({ sim: 'rapid-03-midland' });
  if (q.get('session')) entry.set('session', q.get('session'));
  if (q.get('course')) entry.set('course', q.get('course'));
  location.replace('https://rapidsims.flexee.org/open.html?' + entry.toString());
})();
</script>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BASE=(location.pathname.match(/^\/sim-?\d+/)||[''])[0];

function entryParam(key){return new URLSearchParams(location.hash.slice(1)).get(key)||new URLSearchParams(location.search).get(key)}
let ACCESS_CODE=entryParam('code')||sessionStorage.getItem('m03-access')||null;
if(ACCESS_CODE)sessionStorage.setItem('m03-access',ACCESS_CODE);
let LAUNCH_TOKEN=entryParam('lt')||null;
let LAUNCH=null;
if(LAUNCH_TOKEN){try{LAUNCH=JSON.parse(atob(LAUNCH_TOKEN.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')))}catch{}}
if(LAUNCH_TOKEN&&LAUNCH&&(LAUNCH.role==='faculty'||LAUNCH.role==='faculty_preview'))sessionStorage.setItem('m03-faculty-lt',LAUNCH_TOKEN);
const initialParams=new URLSearchParams(location.search);
const INITIAL_SESSION=(initialParams.get('session')||'').toUpperCase();
if(LAUNCH_TOKEN||ACCESS_CODE){
  const keep=new URLSearchParams(location.search);keep.delete('lt');keep.delete('code');
  history.replaceState(null,'',location.pathname+(keep.toString()?'?'+keep.toString():''));
}

let C=null;
const S={
  step:0, strategicView:'', year1:null, year2:null,
  year1Outcome:null, year2Outcome:null, allOutcomes:null,
  reflection1:'',reflection2:'',finished:false,year2Event:0,viewCommitted:false,
  sessionCode:INITIAL_SESSION,participantId:localStorage.getItem('m03-pid')||'',
  session:null,me:null,mates:[],canSubmit:true,teamRun:null,
  poll:null,error:'',closingLesson:null,
  runnerId:null,runnerRevision:0,canAssignRunner:false,runnerChoice:'',
  hasSessionState:false,stateRequest:0,stateApplied:0,reflectionDirty:false,advancing:false
};
const STEPS=['Brief','Room','Position','View','Year 1','Outcome','Year 2','Events','Year 3','Buyers','Close'];

function friendlyError(code,status){
  const m={
    strategic_view_locked:'Your opening view was committed before Year 1 and can no longer be changed.',
    year1_locked:'Year 1 has already been committed and cannot be changed after its outcome is revealed.',
    year2_locked:'Year 2 has already been committed and cannot be changed after its events are revealed.',
    session_not_running:'Your instructor has not started the session yet.',
    session_paused:'Your instructor has paused the session.',
    captain_only:'Only the selected simulation runner can commit this choice.',
    runner_only:'Only the selected simulation runner can submit or advance the shared run.',
    runner_changed:'Runner control changed. Review the current selection before continuing.',
    runner_must_be_teammate:'Choose a member of your own team.',
    team_lead_only:'Only your team lead can assign the simulation runner.',
    run_already_completed:'The shared team run is complete.',
    team_run_not_complete:'Wait for your team runner to reach the close before submitting your reflection.',
    not_joined:'Rejoin the session before continuing.'
  };
  if(/^budget_must_equal_\d+$/.test(code))return `The allocation must equal exactly $${code.split('_').pop()}M.`;
  if(/^run_minimum_\d+$/.test(code))return `Run cannot be below $${code.split('_').pop()}M.`;
  if(/^(uptime|capacity|connect|features)_maximum_\d+$/.test(code))return `That line cannot exceed $${code.split('_').pop()}M per year.`;
  return m[code]||'';
}

async function request(path,payload,method='POST'){
  const headers={'Content-Type':'application/json'};
  if(LAUNCH_TOKEN)headers['x-launch-token']=LAUNCH_TOKEN;
  else if(ACCESS_CODE)headers['x-access-code']=ACCESS_CODE;
  const opt={method,headers};
  if(method!=='GET')opt.body=JSON.stringify({...payload,calibrationId:C?.calibrationId});
  const r=await fetch(BASE+path,opt);
  let d={};try{d=await r.json()}catch{}
  if(!r.ok){const e=new Error(d.message||friendlyError(d.error,r.status)||`Server error ${r.status}`);e.code=d.error;throw e}
  return d;
}
async function sessionApi(payload){
  const headers={'Content-Type':'application/json'};
  if(LAUNCH_TOKEN)headers['x-launch-token']=LAUNCH_TOKEN;
  const r=await fetch(BASE+'/api/session',{method:'POST',headers,body:JSON.stringify(payload)});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok){const e=new Error(d.message||friendlyError(d.error,r.status)||`Server error ${r.status}`);e.code=d.error;throw e}
  return d;
}

function shell(content){
  const visibleSteps=STEPS.map((x,i)=>({x,i})).filter(o=>C?.buyers?.authored!==false||o.i!==9);
  const pills=visibleSteps.map((o,j)=>o.i===0
    ? `<button type="button" class="pill brief-link ${o.i===S.step?'on':o.i<S.step?'done':''}" data-open-briefing title="Open briefing packet">${j+1}. ${o.x}</button>`
    : `<span class="pill ${o.i===S.step?'on':o.i<S.step?'done':''}">${j+1}. ${o.x}</span>`).join('');
  app.innerHTML=`<header><div class="brand"><h1>Midland Equipment</h1><div class="sub">Flexee RapidSim 03 · architecture</div></div><div class="pills">${pills}</div><div class="timer">30 MIN</div></header><main class="page">${teamBanner()}${content}</main>${briefingPacketModal()}`;
  wireBriefingPacketModal();
  wireRunnerPicker();
}
function teamBanner(){
  if(!S.session)return '';
  const mode=S.session.mode==='team'?'Team':'Individual';
  if(S.session.mode!=='team')return `<div class="team"><b>${mode} session ${esc(S.session.code)}</b><br>You can commit this run.</div>`;
  if(!S.me?.groupId)return `<div class="team"><b>Waiting for team assignment · session ${esc(S.session.code)}</b><br>Your instructor will place you on a team. Once assigned, your team can decide which one student will run the simulation. Stay on this page; it updates automatically.</div>`;
  const teamName=esc(S.me?.teamLabel||'Your team');
  const roster=S.mates.length?S.mates.map(x=>esc(x.name)+(x.isCaptain?' (team lead)':'')+(x.isRunner?' (runner)':'')).join(' · '):'Waiting for teammates';
  const commit=S.teamRun?.year1?`Year 1 committed${S.teamRun.updatedAt?' · '+new Date(S.teamRun.updatedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}`:'Year 1 not committed yet';
  const control=S.canSubmit?'You are the selected runner. Only you can submit and advance this shared simulation.':`${teamRunner()?.name||'The selected runner'} is operating the simulation. Your screen follows the shared decisions and results.`;
  return `<div class="team"><b>${teamName} · session ${esc(S.session.code)}</b><br>${roster}<br>${esc(commit)} · ${esc(control)}${runnerPicker()}</div>`;
}
function notice(msg,bad=false){return `<div class="notice ${bad?'error':''}">${esc(msg)}</div>`}
async function goToStep(n){
  if(S.advancing||blocked()||(S.session?.mode==='team'&&!S.canSubmit))return;
  S.advancing=true;
  try{
    if(S.session?.mode==='team')await saveRun({screen:n});
    S.step=n;render();
  }catch(e){alert(e.message)}finally{S.advancing=false}
}
function next(){let n=Math.min(10,S.step+1);if(n===9&&C?.buyers?.authored===false)n=10;return goToStep(n)}
function back(){let n=Math.max(0,S.step-1);if(n===9&&C?.buyers?.authored===false)n=8;return goToStep(n)}
function safeToRerender(){if(document.getElementById('briefingPacketModal')?.classList.contains('open'))return false;const el=document.activeElement;return !el||!['INPUT','TEXTAREA','SELECT'].includes(el.tagName)}

async function init(){
  try{C=await request('/api/config',null,'GET')}
  catch(e){
    if(INITIAL_SESSION&&['access_code_required','access_code_not_configured','launch_token_invalid'].includes(e.code)){
      location.replace(BASE+'/api/join?session='+encodeURIComponent(INITIAL_SESSION));return;
    }
    if(e.code==='access_code_required'&&!LAUNCH_TOKEN){
      sessionStorage.removeItem('m03-access');
      app.innerHTML=`<main class="page">${notice('An access code is required to open Midland Equipment.',true)}<div class="actions"><button class="btn pri" id="accessBtn">Enter access code</button></div></main>`;
      document.getElementById('accessBtn').onclick=()=>location.assign(BASE+'/launch.html');
      return;
    }
    app.innerHTML=`<main class="page">${notice(e.message,true)}<div class="actions"><button class="btn pri" onclick="location.reload()">Try again</button></div></main>`;
    return;
  }
  if(INITIAL_SESSION&&LAUNCH?.sub){
    // Always bind to the signed account; a shared browser may remember another
    // student's participant ID. The server reuses this account's existing place.
    try{
      const d=await sessionApi({action:'join',code:INITIAL_SESSION});
      S.participantId=d.participantId;S.session=d.session;S.me=d.me;
      localStorage.setItem('m03-pid',S.participantId);
    }catch(e){S.error=e.message;renderJoin();return}
  }
  if(INITIAL_SESSION&&!S.participantId){renderJoin();return}
  if(INITIAL_SESSION&&S.participantId){
    try{await pollSession(true)}
    catch{S.participantId='';localStorage.removeItem('m03-pid');renderJoin();return}
  }
  render();
  if(S.sessionCode&&S.participantId)startPolling();
}

function renderJoin(){
  shell(`<section class="joinbox"><div class="eyebrow">Facilitated session</div><h2>Join Midland Equipment</h2><p class="lede">Enter your name and the session code shown by your instructor. Your instructor will place you on a team if this is a team session.</p>
  ${S.error?notice(S.error,true):''}
  <div class="field"><label>Name</label><input id="joinName" autocomplete="name" value="${esc(LAUNCH?.name||'')}" ${LAUNCH?.sub?'readonly':''} placeholder="Your name"></div>
  <div class="field"><label>Session code</label><input id="joinCode" class="mono" maxlength="5" value="${esc(S.sessionCode)}" placeholder="ABCDE"></div>
  <div class="actions"><button class="btn pri" id="joinBtn">Join session</button></div></section>`);
  document.getElementById('joinBtn').onclick=joinSession;
}
async function joinSession(){
  const name=document.getElementById('joinName').value.trim();
  const code=document.getElementById('joinCode').value.trim().toUpperCase();
  try{
    const d=await sessionApi({action:'join',code,name,participantId:S.participantId||undefined});
    S.sessionCode=code;S.participantId=d.participantId;S.session=d.session;S.me=d.me;
    localStorage.setItem('m03-pid',S.participantId);S.error='';
    const params=new URLSearchParams(location.search);params.set('session',code);history.replaceState(null,'',location.pathname+'?'+params.toString());
    await pollSession(true);startPolling();render();
  }catch(e){S.error=e.message;renderJoin()}
}
function startPolling(){
  clearInterval(S.poll);S.poll=setInterval(()=>pollSession(false).catch(()=>{}),2000);
}
async function pollSession(redraw){
  if(!S.sessionCode||!S.participantId)return;
  const seq=++S.stateRequest;
  const d=await sessionApi({action:'state',code:S.sessionCode,participantId:S.participantId});
  if(seq<S.stateApplied)return;
  S.stateApplied=seq;
  const rulesChanged=JSON.stringify(S.session?.allocationRules)!==JSON.stringify(d.session?.allocationRules);
  const groupChanged=S.me?.groupId!==d.me?.groupId;
  const controlChanged=groupChanged||S.canSubmit!==!!d.canSubmit||S.runnerId!==d.runnerId||S.runnerRevision!==(d.runnerRevision||0);
  const gateChanged=S.session?.state!==d.session?.state||S.session?.paused!==d.session?.paused;
  const restore=!S.hasSessionState||groupChanged||(controlChanged&&d.canSubmit);
  const changed=JSON.stringify([S.session,S.me,S.mates,S.teamRun])!==JSON.stringify([d.session,d.me,d.mates,d.run]);
  S.session=d.session;S.me=d.me;S.mates=d.mates||[];S.canSubmit=!!d.canSubmit;S.teamRun=d.run||null;
  if(C&&S.session?.allocationRules){
    Object.assign(C,S.session.allocationRules);
    if(C.room?.intro)C.room.intro=C.room.intro.replace(/(?:nine|\d+) million dollars/,`${C.annualBudget} million dollars`);
    for(const key of ['intro','whatHappens'])if(C.briefing?.[key])C.briefing[key]=C.briefing[key].map(text=>text.replace(/two annual \$\d+ million allocations/g,`two annual $${C.annualBudget} million allocations`));
  }
  S.runnerId=d.runnerId||null;S.runnerRevision=d.runnerRevision||0;S.canAssignRunner=!!d.canAssignRunner;S.hasSessionState=true;
  if(controlChanged)S.runnerChoice='';
  if(groupChanged){S.reflectionDirty=false;S.reflection1='';S.reflection2=''}
  const r=S.teamRun;
  if(rulesChanged){
    if(!r?.year1&&!S.year1Outcome)S.year1=null;
    if(!r?.year2&&!S.year2Outcome)S.year2=null;
  }
  if(restore&&S.session?.mode==='team'){
    S.step=r?.screen??(r?.phase>=3?10:r?.year2?7:r?.year1?5:r?.strategicView?4:0);
    S.year2Event=r?.year2Event||0;
    S.strategicView=r?.strategicView||'';S.viewCommitted=!!r?.strategicView;
    S.year1=r?.year1||null;S.year2=r?.year2||null;
    S.year1Outcome=null;S.year2Outcome=null;S.allOutcomes=null;
  }
  if(r){
    if(r.strategicView){S.strategicView=r.strategicView;S.viewCommitted=true}
    if(r.year1)S.year1={...r.year1};
    if(r.year2)S.year2={...r.year2};
    if(!S.reflectionDirty){S.reflection1=r.reflection1||'';S.reflection2=r.reflection2||''}
    if(r.outcomes){S.allOutcomes=r.outcomes;S.year1Outcome=r.outcomes.year1||null;S.year2Outcome=r.outcomes.year2||null}
  }
  if(S.session?.mode==='team')S.finished=!!r?.done;
  // Revocation must redraw even while the former runner has a focused input.
  if(redraw||controlChanged||gateChanged||(changed&&safeToRerender()))render();
}
function sessionGate(){
  if(!S.session)return '';
  if(S.session.state==='lobby')return notice('The instructor has not started this session yet.');
  if(S.session.paused)return notice('The instructor has paused the session.');
  if(S.session.state==='closed')return notice('This session is closed.',true);
  return '';
}
function blocked(){return !!(S.session&&(S.session.state!=='running'||S.session.paused||(S.session.mode==='team'&&!S.me?.groupId)))}

async function saveRun(patch){
  if(!S.session)return {ok:true};
  const shared=['strategicView','year1','year2','screen','year2Event'].some(k=>patch[k]!==undefined);
  if(!S.canSubmit&&shared)throw new Error('Only the selected simulation runner can submit or advance the shared run.');
  try{
    const d=await sessionApi({action:'submit',code:S.sessionCode,participantId:S.participantId,runnerRevision:S.runnerRevision,...patch});
    S.stateApplied=++S.stateRequest; // Ignore state reads started before this write.
    return d;
  }catch(e){
    if(['runner_only','runner_changed','run_changed'].includes(e.code))await pollSession(true).catch(()=>{});
    throw e;
  }
}
function nav({backOk=true,nextLabel='Continue',onNext,disabled=false}={}){
  disabled=disabled||blocked()||(S.session?.mode==='team'&&!S.canSubmit);
  return `<div class="actions">${backOk?'<button class="btn" id="backBtn">Back</button>':''}<button class="btn pri" id="nextBtn" ${disabled?'disabled':''}>${esc(nextLabel)}</button></div>`;
}
function wireNav(onNext,backOk=true){
  if(backOk&&document.getElementById('backBtn'))document.getElementById('backBtn').onclick=back;
  document.getElementById('nextBtn').onclick=onNext||next;
}

function teamLead(){return (S.mates||[]).find(x=>x.isCaptain)||null}
function teamProgressText(){
  const r=S.teamRun||{};
  if((r.phase||0)>=3)return 'The shared run is complete. The same team result is ready here.';
  if(r.year2)return 'Year 2 is committed. Your runner is moving through the final consequences.';
  if(r.year1)return 'Year 1 is committed. Your runner is continuing the shared run.';
  if(r.strategicView)return 'The opening view is committed. Your runner is working on Year 1.';
  return 'The shared run has not committed its opening view yet.';
}
function teamRunner(){return S.mates.find(x=>x.id===S.runnerId)||null}
function runnerPicker(){
  if(!S.canAssignRunner)return '';
  const value=S.runnerChoice||S.runnerId;
  return `<div class="field"><label for="runnerSelect">Who will run the simulation for your team?</label>
    <select id="runnerSelect">${S.mates.map(m=>`<option value="${esc(m.id)}" ${m.id===value?'selected':''}>${esc(m.name)}${m.isCaptain?' (team lead)':''}</option>`).join('')}</select>
    <div class="hint">Agree as a team; the team lead assigns the runner. Changing the runner keeps all submitted decisions and progress. Unsubmitted drafts stay on the previous device.</div>
    <div class="actions"><button type="button" class="btn" id="assignRunnerBtn" ${value===S.runnerId?'disabled':''}>Assign runner</button></div></div>`;
}
function wireRunnerPicker(){
  const select=document.getElementById('runnerSelect'),button=document.getElementById('assignRunnerBtn');
  if(!select||!button)return;
  const expectedRunnerId=S.runnerId,runnerRevision=S.runnerRevision;
  select.onchange=()=>{S.runnerChoice=select.value;button.disabled=select.value===S.runnerId};
  button.onclick=async()=>{
    button.disabled=true;
    try{
      await sessionApi({action:'set_runner',code:S.sessionCode,participantId:S.participantId,runnerId:select.value,expectedRunnerId,runnerRevision});
      S.stateApplied=++S.stateRequest;S.runnerChoice='';
      await pollSession(true);
    }catch(e){alert(e.message);await pollSession(true).catch(()=>{button.disabled=false})}
  };
}

function renderUnassignedLobby(){
  const teamText=S.session?.state==='running'
    ? 'The class has started, but your team has not been assigned yet. Ask your instructor to place you into a group.'
    : 'Your instructor will create groups from the students who have joined. Stay on this page; it updates automatically.';
  shell(`<div class="eyebrow">Waiting for group assignment</div><h2>You are in the session. The instructor creates the teams.</h2>
    <p class="lede">${esc(teamText)}</p>
    ${sessionGate()}
    <div class="card" style="margin-top:22px"><h3>What happens next</h3><p>1. Faculty releases access from the course page.</p><p>2. Students open the class link and appear as joined.</p><p>3. Faculty creates teams and chooses the team lead / runner.</p><p>4. Only that runner advances the simulation. Other team members watch and discuss.</p></div>
    ${notice('Do not start a separate run. Your group will appear here after the instructor assigns teams.')}`);
}
function renderTeamLobby(){
  const runner=teamRunner(),lead=teamLead(),teamName=S.me?.teamLabel||'Your team';
  const runnerName=runner?.name||lead?.name||'your team lead';
  shell(`<div class="eyebrow">Team lobby</div><h2>${esc(teamName)} has one shared run.</h2>
    <p class="lede">The team lead / runner will run the simulation on one screen. Everyone else should discuss decisions with that person, not start a separate run.</p>
    <div class="card" style="margin-top:22px"><h3>Selected runner</h3><p>${runner?`<b>${esc(runner.name)}</b> will run the simulation for this team.`:'Waiting for the instructor to choose a team lead / runner.'}</p><p class="hint">Only the selected runner gets the Start/Continue controls after faculty starts the room.</p></div>
    ${!S.canSubmit?notice(`Your team lead / runner is ${runnerName}. Contact ${runnerName} and play together on that person's screen.`):''}
    ${sessionGate()}`);
}
function sharedResultsHTML(){
  const r=S.teamRun||{},o=r.outcomes||{};
  const cards=[o.year1, (r.screen>=7?o.year2?.heat:null), (r.year2Event>=1||r.screen>=8?o.year2?.competitor:null), (r.screen>=8?o.year3:null)].filter(Boolean);
  return `${r.strategicView?`<div class="card"><h3>Team opening view</h3><p>${esc(r.strategicView)}</p></div>`:''}
    ${r.year1?readOnlyAllocationHTML(r.year1,'Shared Year 1 allocation',1):''}
    ${r.year2?readOnlyAllocationHTML(r.year2,'Shared Year 2 allocation',2):''}
    ${cards.map(x=>`<div class="outcome"><h3>${esc(x.title)}</h3><p>${esc(x.narrative)}</p></div>`).join('')}`;
}
function renderTeamMemberWaiting(){
  const runner=teamRunner(),teamName=S.me?.teamLabel||'Your team',runnerName=runner?.name||'your team lead';
  shell(`<div class="eyebrow">Team mode · read-only</div><h2>${esc(runnerName)} will run the simulation for ${esc(teamName)}.</h2>
    <p class="lede">Contact ${esc(runnerName)} and make decisions together on that person's screen. This page is read-only so the team does not accidentally create separate results.</p>
    ${sessionGate()}${notice(teamProgressText())}
    <div class="card"><h3>Your role</h3><p>Discuss, challenge, and help decide. The same team result will appear here after the runner completes the shared run.</p></div>
    ${sharedResultsHTML()}`);
}
function renderTeamMemberReflection(){
  shell(`<div class="eyebrow">Your reflection</div><h2>The shared team run is complete.</h2>
    <p class="lede">You worked through the decisions with your team on one runner's screen. Now answer these two questions in your own words.</p>
    <div class="field"><label>${esc(C.reflectionPrompts[0])}</label>${C.reflectionFollowups?.[0]?`<div class="reflection-followup">${esc(C.reflectionFollowups[0])}</div>`:''}<textarea id="r1" maxlength="1500">${esc(S.reflection1)}</textarea><div class="hint reflection-note">Your instructor can see this response and may read it aloud in the debrief. It is not scored.</div></div>
    <div class="field"><label>${esc(C.reflectionPrompts[1])}</label><textarea id="r2" maxlength="1500">${esc(S.reflection2)}</textarea><div class="hint reflection-note">Your instructor can see this response and may read it aloud in the debrief. It is not scored.</div></div>
    <div class="actions"><button class="btn pri" id="memberFinishBtn">Submit my reflection</button></div>`);
  document.getElementById('memberFinishBtn').onclick=finish;
}
function render(){
  if(!C)return;
  if(S.session?.mode==='team'){
    if(!S.me?.groupId)return renderUnassignedLobby();
    if(S.finished)return renderClose();
    if(S.session.state==='lobby')return renderTeamLobby();
    if(!S.canSubmit){
      return renderTeamMemberWaiting();
    }
  }
  switch(S.step){
    case 0:return renderBrief();
    case 1:return renderRoom();
    case 2:return renderPosition();
    case 3:return renderView();
    case 4:return renderAllocation(1);
    case 5:return renderYear1Outcome();
    case 6:return renderAllocation(2);
    case 7:return renderYear2Events();
    case 8:return renderYear3();
    case 9:return renderBuyers();
    default:return renderClose();
  }
}

function briefingPacketModal(){
  const b=C?.briefing;if(!b)return '';
  const intro=(b.intro||[]).map((x,i)=>`${i===0?'<b>':''}${esc(x)}${i===0?'</b>':''}`).join('<br>');
  const exhibits=(b.exhibits||[]).map(ex=>{
    const body=(ex.body||[]).map(x=>`<p>${esc(x)}</p>`).join('');
    const table=ex.rows?.length?`<div class="briefing-dialog-table"><table><thead>${ex.columns?.length?`<tr>${ex.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`:''}</thead><tbody>${ex.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';
    return `<section class="briefing-dialog-section"><h3>${esc(ex.title)}</h3>${body}${table}${ex.note?`<p><b>${esc(ex.note)}</b></p>`:''}</section>`;
  }).join('');
  const people=(b.people||[]).map(p=>`<div class="briefing-person"><b>${esc(p.name||p.role)} · ${esc(p.role)}</b><br>“${esc(p.quote)}”</div>`).join('');
  return `<div class="briefing-modal" id="briefingPacketModal" aria-hidden="true"><section class="briefing-dialog" role="dialog" aria-modal="true" aria-labelledby="briefingPacketTitle">
    <div class="briefing-dialog-head"><div class="grow"><div class="briefing-dialog-kicker">Pre-session briefing · about 6 minutes</div><div class="briefing-dialog-title" id="briefingPacketTitle">Midland Equipment — Briefing</div><div class="briefing-dialog-meta">Reference copy · read before starting the simulation</div></div><button class="briefing-dialog-close" id="closeBriefingPacket" aria-label="Close briefing">×</button></div>
    <div class="briefing-dialog-body"><div class="briefing-dialog-intro">${intro}</div>

function wireBriefingPacketModal(){
  const modal=document.getElementById('briefingPacketModal');
  const openBtns=[...document.querySelectorAll('[data-open-briefing]')];
  if(!modal||!openBtns.length)return;
  const closeBtn=document.getElementById('closeBriefingPacket');
  const doneBtn=document.getElementById('doneBriefingPacket');
  let lastFocus=null;
  const escHandler=e=>{if(e.key==='Escape')close()};
  const open=()=>{lastFocus=document.activeElement;modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.addEventListener('keydown',escHandler);closeBtn?.focus()};
  const close=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';document.removeEventListener('keydown',escHandler);lastFocus?.focus()};
  openBtns.forEach(btn=>btn.onclick=open);if(closeBtn)closeBtn.onclick=close;if(doneBtn)doneBtn.onclick=close;
  modal.onclick=e=>{if(e.target===modal)close()};
}

    </div>
    ${closingLessonHTML()}`}
    <div class="notice run-complete">Run complete. The full outcome, portfolio and reflections are ready to screenshot or print to PDF.</div>
    <div class="actions"><button class="btn pri" id="printBtn">Print / save PDF</button><a class="btn" id="studentHomeBtn" href="${esc((C.platformUrl||location.origin).replace(/\/$/,'')+'/student.html')}">Back to student home</a></div>`);
    document.getElementById('printBtn').onclick=()=>window.print();
    return;
  }
  shell(`<div class="eyebrow">Close</div><h2>The decisions are over. Explain what you would defend or change.</h2>
  <div class="summary"><div class="card"><h3>Your opening view</h3><p>${esc(S.strategicView||'—')}</p></div>
  <div class="card"><h3>Your Year 1 allocation</h3>${S.year1?miniAlloc(S.year1):'<p>—</p>'}</div></div>
  <div class="field"><label>${esc(C.reflectionPrompts[0])}</label>${C.reflectionFollowups?.[0]?`<div class="reflection-followup">${esc(C.reflectionFollowups[0])}</div>`:''}<textarea id="r1" maxlength="1500">${esc(S.reflection1)}</textarea><div class="hint reflection-note">Your instructor can see this response and may read it aloud in the debrief. It is not scored.</div></div>
  <div class="field"><label>${esc(C.reflectionPrompts[1])}</label><textarea id="r2" maxlength="1500">${esc(S.reflection2)}</textarea><div class="hint reflection-note">Your instructor can see this response and may read it aloud in the debrief. It is not scored.</div></div>
  <div class="actions"><button class="btn pri" id="finishBtn">Complete run</button></div>`);
  document.getElementById('finishBtn').onclick=finish;
}
function miniAlloc(a){return `<div class="mini">${C.lines.map(l=>`<div><b>${a[l.id]}</b><span>${esc(l.label)}</span></div>`).join('')}</div>`}
function overallOutcomeText(){
  const y1=(S.allOutcomes?.year1||S.year1Outcome)?.band;
  const heat=(S.allOutcomes?.year2||S.year2Outcome)?.heat?.band;
  const competitor=(S.allOutcomes?.year2||S.year2Outcome)?.competitor?.band;
  const y3=S.allOutcomes?.year3?.band;
  const a={
    strong:'Customer reporting became a real capability early.',
    middle:'Customer reporting became possible, but slowly and with manual work.',
    weak:'The first customer request exposed a reporting gap.'
  }[y1]||'';
  const b={
    strong:'Operational resilience held when the heat wave tested the company.',
    middle:'The heat wave strained operations but did not fully break them.',
    weak:'The heat wave exposed a serious resilience weakness.'
  }[heat]||'';
  const c={
    strong:'Midland could answer the competitor from a position of strength.',
    middle:'Midland could only mount a limited pilot response to the competitor.',
    weak:'Midland could not respond quickly to the competitor’s new service model.'
  }[competitor]||'';
  const d={
    strong:'By Year 3, the architecture supported predictive service as something Midland could actually sell.',
    pilot:'By Year 3, predictive service was promising, but still only a pilot.',
    data_no_room:'You have three years of fault history and nowhere to put it.',
    weak:'By Year 3, the architecture still lacked the usable data foundation for predictive service.'
  }[y3]||'';
  return [a,b,c,d].filter(Boolean).join(' ');
}
async function finish(){
  S.reflection1=document.getElementById('r1').value.trim();S.reflection2=document.getElementById('r2').value.trim();
  try{
    if(S.session)await saveRun({reflection1:S.reflection1,reflection2:S.reflection2,done:true});
    const done=await request('/api/finish',{runnerRevision:S.runnerRevision,year1:S.year1,year2:S.year2,strategicView:S.strategicView,reflection1:S.reflection1,reflection2:S.reflection2,sessionCode:S.sessionCode,participantId:S.participantId});
    S.closingLesson=done.closingLesson||null;S.finished=true;S.reflectionDirty=false;render();
    requestAnimationFrame(()=>document.getElementById('closingLesson')?.scrollIntoView({behavior:'smooth',block:'start'}));
  }catch(e){alert(e.message)}
}

document.addEventListener('input',e=>{
  if(e.target.id==='r1'){S.reflection1=e.target.value;S.reflectionDirty=true}
  if(e.target.id==='r2'){S.reflection2=e.target.value;S.reflectionDirty=true}
  if(e.target.id==='viewText'&&!S.viewCommitted)S.strategicView=e.target.value;
});

init();
</script>
</body>
</html>
