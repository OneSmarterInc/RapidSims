0 0}.result-guide{border-left:2px solid var(--x)}details.advanced{grid-column:1/-1;border:1px solid var(--l);background:var(--p);padding:0 18px 18px}details.advanced summary{cursor:pointer;padding:15px 0;font:10.5px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--a)}details.advanced .card{border:1px solid var(--l);margin-top:12px;background:var(--p2)}.team-lead,.move-member,.assign-member,#as,#bs{width:100%;background:var(--n);border:1px solid var(--l2);padding:8px 9px;color:var(--b);min-height:40px}.team-lead option,.move-member option,.assign-member option,#as option,#bs option{background:#0E1524;color:#E8E4DA}.move-member:disabled,.assign-member:disabled,.team-lead:disabled{background:#111827;color:var(--d);opacity:.75}@media(max-width:900px){.flow-steps,.roster-stats{grid-template-columns:1fr}}.presentbar{display:flex;gap:8px;align-items:center;margin:12px 0}.present{position:fixed;inset:0;z-index:50;background:var(--n);padding:5vh 6vw;overflow:auto}.present .card{display:none;border:0;background:transparent;padding:0}.present .card.present-on{display:block!important}.present h2{font-size:64px}.present h3{font-size:44px}.present .scatter{height:58vh}.dotcount{position:absolute;transform:translate(-50%,50%);display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--a);color:#191206;font:600 11px var(--m);border:2px solid var(--n)}@media(max-width:900px){.card,.third{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}.contrast,.thresholds,.modes,.team-tools,.team-board{grid-template-columns:1fr}.team-head,.member-row,.unassigned-row{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="faculty-workspace.css?v=20260911"></head><body><header><h1>Midland Equipment</h1><div class="sub">Instructor view · RapidSim 03</div><span id="hs" class="status"></span></header><main id="app" class="page"></main><script src="faculty-workspace.js?v=20260911"></script><script>
const app=document.getElementById('app');function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
const BASE=(location.pathname.match(/^\/sim-?\d+/)||[''])[0];
const FACULTY_TOKEN_KEY='m03-faculty-lt';
const incomingLT=new URLSearchParams(location.hash.slice(1)).get('lt')||new URLSearchParams(location.search).get('lt')||null;
let LT=incomingLT||sessionStorage.getItem(FACULTY_TOKEN_KEY)||null;
if(incomingLT)sessionStorage.setItem(FACULTY_TOKEN_KEY,incomingLT);
if(incomingLT){let p=new URLSearchParams(location.search);p.delete('lt');history.replaceState(null,'',location.pathname+(p.toString()?'?'+p:''))}
const savedCode=(location.hash||'').replace('#','')||localStorage.getItem('m03-faculty-session')||'';let facultyCode='',mode='',code='',state=null,poll=null,error='',aSel='',bSel='',presentIndex=0;
let draftName='Midland Equipment',draftResume=savedCode,busy=false,authProblem=false,courseChoices=[],renewing=null;
const launchPreference=new URLSearchParams(location.search).get('play');
if(['team','individual'].includes(launchPreference))mode=launchPreference;
const FACULTY_COURSE_KEY='m03-faculty-course';
const PLATFORM_LAUNCH_PATH='/api/launch';
function attr(value){return esc(value).replaceAll('"','&quot;')}
let facultyDashboard=BASE?'/faculty.html':'';
function tokenInfo(token){try{return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(token.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))))}catch{return null}}
// This metadata only selects a class for reauthorization. The platform checks
// its signed-in user and course ownership; the sim still verifies the signature.
let facultyCourse=new URLSearchParams(location.search).get('course')||tokenInfo(LT)?.course||sessionStorage.getItem(FACULTY_COURSE_KEY)||'';
function rememberCourse(value){facultyCourse=String(value||'');if(facultyCourse)sessionStorage.setItem(FACULTY_COURSE_KEY,facultyCourse);else sessionStorage.removeItem(FACULTY_COURSE_KEY);const u=new URL(location.href);if(facultyCourse)u.searchParams.set('course',facultyCourse);else u.searchParams.delete('course');history.replaceState(null,'',u.pathname+u.search+u.hash)}
if(incomingLT)rememberCourse(tokenInfo(incomingLT)?.course||'');
function captureDraft(){draftName=document.getElementById('name')?.value??draftName;draftResume=document.getElementById('resumeCode')?.value??draftResume;facultyCode=document.getElementById('fc')?.value.trim()??facultyCode}
function recoveryLink(){if(!facultyDashboard)return notice('Open your RapidSims faculty dashboard to renew access.');return `<div class="actions"><a class="btn" id="facultyRecovery" href="${esc(facultyDashboard+(facultyCourse?'?course='+encodeURIComponent(facultyCourse):''))}" target="_blank" rel="noopener">Open faculty dashboard</a></div>`}
async function renewFaculty(){
  if(renewing)return renewing;
  renewing=(async()=>{
    if(!BASE)throw new Error('Open this session from your RapidSims faculty dashboard, or enter your configured standalone facilitator code.');
    const q=new URLSearchParams({sim:'rapid-03-midland',mode:'session',format:'json'});if(facultyCourse)q.set('course',facultyCourse);
    const r=await fetch(PLATFORM_LAUNCH_PATH+'?'+q,{credentials:'same-origin',cache:'no-store'});let d={};try{d=await r.json()}catch{}
    if(d.error==='course_selection_required'){courseChoices=Array.isArray(d.courses)?d.courses:[];throw new Error('Choose the course for this session, then try again.')}
    if(r.status===401)throw new Error('Sign in to your faculty account from the dashboard, then return here and try again. Your session details have been kept.');
    if(!r.ok)throw new Error(d.message||'Unable to renew faculty access. Open your faculty dashboard and try again.');
    let token=null;try{const u=new URL(d.url,location.origin);token=new URLSearchParams(u.hash.slice(1)).get('lt')||u.searchParams.get('lt')}catch{}
    const info=tokenInfo(token);
    if(!info||info.sim!=='rapid-03-midland'||!['faculty','faculty_preview'].includes(info.role)||info.mode!=='session')throw new Error('Sign in with a faculty account to create or manage a class session.');
    LT=token;sessionStorage.setItem(FACULTY_TOKEN_KEY,LT);rememberCourse(info.course||'');courseChoices=[];
  })();
  try{return await renewing}finally{renewing=null}
}
function showAuthProblem(message){authProblem=true;error=message;clearInterval(poll);const box=document.getElementById('faculty-error');if(box)box.innerHTML=notice(message,true)+recoveryLink()}

function safeToRerender(){const el=document.activeElement;return !el||el.readOnly||el.disabled||!['INPUT','TEXTAREA','SELECT'].includes(el.tagName)}
let stateRequest=0;
async function api(x){
  if(!['faculty_state','faculty_enrolments'].includes(x.action))stateRequest++;
  async function send(){const usedToken=LT,h={'Content-Type':'application/json'};if(usedToken)h['x-launch-token']=usedToken;const r=await fetch(BASE+'/api/session',{method:'POST',headers:h,body:JSON.stringify({...x,facultyCode,launchToken:usedToken})});let d={};try{d=await r.json()}catch{}return {r,d,usedToken}}
  if(!facultyCode&&(!LT||(BASE&&tokenInfo(LT)?.mode!=='session'))){try{await renewFaculty()}catch(e){showAuthProblem(e.message);throw e}}
  let result=await send();
  if(result.d.error==='faculty_authorization_required'&&!facultyCode){
    try{
      // Another overlapping poll may already have renewed this token.
      if(LT===result.usedToken){await renewFaculty()}
      result=await send();
    }catch(e){showAuthProblem(e.message);throw e}
  }
  const {r,d}=result;
  if(!r.ok){
    if(d.error==='faculty_authorization_required'){
      const message=facultyCode?'That facilitator code was not accepted. Check the code, or open the session from your faculty dashboard.':'The simulation could not verify your renewed faculty access. Open your faculty dashboard and try again. If it continues, the platform and simulation launch configuration needs checking.';
      sessionStorage.removeItem(FACULTY_TOKEN_KEY);LT=null;showAuthProblem(message);throw new Error(message);
    }
    throw new Error(d.message||d.error||`Server error ${r.status}`);
  }
  if(authProblem){authProblem=false;error='';const box=document.getElementById('faculty-error');if(box)box.innerHTML=''}
  return d;
}
const notice=(s,b=false)=>`<div class="notice ${b?'bad':''}">${esc(s)}</div>`;const vals=o=>Object.values(o||{}).filter(Boolean);function stablePeople(list){return list.slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)||String(a.name||'').localeCompare(String(b.name||''))||String(a.id||'').localeCompare(String(b.id||'')))}const participants=()=>stablePeople(vals(state?.participants)),runs=()=>vals(state?.runs).sort((a,b)=>String(a.runId||'').localeCompare(String(b.runId||'')));
function render(){document.getElementById('hs').textContent=state?`${state.session.state} · ${state.session.mode}`:'';code?consoleView():createView()}
function createView(){app.innerHTML=`<div class="ey">New facilitated session</div><h2>Choose how this room will play.</h2><p class="lede">Individual and team are both first-class modes. There is deliberately no default.</p>${error?notice(error,true):''}${authProblem?recoveryLink():''}<div class="grid"><section class="card"><h3>Session</h3><div class="field"><label>Class / session name</label><input id="name" value="${attr(draftName)}"></div><div class="field"><label>Play mode — required</label><div class="modes"><div class="mode ${mode==='individual'?'on':''}" data-mode="individual"><b>Individual</b><span>Every student commits a portfolio.</span></div><div class="mode ${mode==='team'?'on':''}" data-mode="team"><b>Team</b><span>Approved course students appear for team setup before they open the simulation. Choose one lead per team.</span></div></div></div>${courseChoices.length?`<div class="field"><label for="facultyCourse">Course for this session</label><select id="facultyCourse"><option value="">Choose course</option>${courseChoices.map(c=>`<option value="${attr(c.id)}" ${facultyCourse===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div>`:''}${LT?notice('Faculty authorization received from RapidSims.'):`${notice(BASE?'Your signed-in faculty account will be checked when you create or resume a session. A separate code is not needed.':'Open the faculty dashboard to use your account, or enter your configured standalone facilitator code.')}<div class="field"><label for="fc">Standalone facilitator code (code-based access only)</label><input id="fc" type="password" value="${attr(facultyCode)}" autocomplete="off"></div>`}<div class="actions"><button class="btn pri" id="create" ${mode&&!busy?'':'disabled'}>${busy?'Please wait…':'Create session'}</button></div><div class="field"><label>Resume session code</label><input id="resumeCode" maxlength="5" value="${attr(draftResume)}" placeholder="ABCDE"></div><div class="actions"><button class="btn" id="resumeBtn" ${busy?'disabled':''}>Resume session</button></div></section><section class="card"><h3>Instructor flow</h3><p>1. Approve students on the course page. 2. Create teams here. 3. Choose each team lead. 4. Click Start session in the bottom action bar. Students open their assigned team; only the runner plays.</p>${notice(mode==='team'?'Team mode is selected from your course page. Groups are created only here by faculty, not by students.':'Individual mode gives every student their own run.')}</section></div>`;document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{if(busy)return;captureDraft();mode=x.dataset.mode;render()});document.getElementById('create').onclick=create;document.getElementById('resumeBtn').onclick=resumeSession;const choice=document.getElementById('facultyCourse');if(choice)choice.onchange=()=>rememberCourse(choice.value)}
async function create(){if(busy)return;captureDraft();busy=true;error='';render();try{const d=await api({action:'create',name:draftName.trim(),mode});code=d.session.code;location.hash=code;localStorage.setItem('m03-faculty-session',code);state={session:d.session,participants:{},runs:{},defaultThresholds:d.session.thresholds};startPoll()}catch(e){error=e.message}finally{busy=false;render()}}
async function resumeSession(){if(busy)return;captureDraft();const v=(draftResume||'').trim().toUpperCase();if(!v){error='Enter the five-character session code to resume.';render();return}busy=true;error='';render();try{const next=await api({action:'faculty_state',code:v});code=v;state=next;location.hash=code;localStorage.setItem('m03-faculty-session',code);startPoll()}catch(e){error=e.message;code=''}finally{busy=false;render()}}

let enrolmentData=null,enrolmentError='',enrolmentBusy=false,enrolmentFetched=0,enrolmentCode='';

function startPoll(){clearInterval(poll);poll=setInterval(refresh,3000);refresh()}
async function refresh(){
  if(!code)return;
  const requestedCode=code,seq=++stateRequest;
  try{
    const next=await api({action:'faculty_state',code:requestedCode});
    if(code!==requestedCode||seq!==stateRequest)return;
    state=next;error='';const errorBox=document.getElementById('faculty-error');if(errorBox)errorBox.innerHTML='';
    if(!document.body.classList.contains('present'))render();
    if(Date.now()-enrolmentFetched>6000)refreshEnrolments();
  }catch(e){error=e.message;const box=document.getElementById('faculty-error');if(box)box.innerHTML=notice(error,true)}
}
let enrolmentTask=null;
async function refreshEnrolments(force=false){
  if(enrolmentTask){await enrolmentTask;if(!force)return;}
  if(!code||!state?.session.platformAuth||!state.session.courseId)return;
  const requestedCode=code;enrolmentBusy=true;
  enrolmentTask=(async()=>{
    try{
      const data=await api({action:'faculty_enrolments',code:requestedCode});
      if(code!==requestedCode)return;
      enrolmentData=data;enrolmentCode=code;enrolmentError='';enrolmentFetched=Date.now();
      // Re-read state AFTER the approved roster import. Do not overwrite an
      // assignment with a participants snapshot captured before another write.
      await refresh();
    }catch(e){if(code===requestedCode)enrolmentError=e.message;}
    finally{enrolmentBusy=false;enrolmentFetched=Date.now();if(code===requestedCode&&!document.body.classList.contains('present'))render();}
  })();
  try{await enrolmentTask;}finally{enrolmentTask=null;}
}
window.addEventListener('focus',()=>{enrolmentFetched=0;refresh()});

function consoleView(){
  if(!state)return;
  window.MidlandFaculty.render({root:app,state,roster:enrolmentCode===code?enrolmentData:null,rosterError:enrolmentError,
    courseUrl:state.session.courseId?(enrolmentData?.manageUrl||(facultyDashboard?facultyDashboard+'?course='+encodeURIComponent(state.session.courseId):'')):'',
    joinUrl:state.session.joinUrl||location.origin+BASE+'/api/join?session='+encodeURIComponent(code),
    api,refresh,refreshRoster:async()=>{await refreshEnrolments(true);if(enrolmentError)throw new Error(enrolmentError);await refresh()},
    advanced:()=>calibrate(state.session)+readiness(state.session),debrief:()=>analytics(runs()),present:startPresent,
    selectDebrief:(side,value)=>{if(side==='left')aSel=value;else bSel=value;}
  });
}
function calibrate(s){const t=s.thresholds||state.defaultThresholds||{},L={budgetPerYear:'Annual budget ($M)',runFloor:'Run minimum ($M)',perLineCap:'Other-line annual cap ($M)',year1ConnectStrong:'Year 1 Connect strong ≥',heatUptimeStrong:'Heat wave Uptime strong ≥',heatUptimeMiddle:'Heat wave middle starts at ≥',competitorConnectStrong:'Competitor strong ≥',competitorConnectPilotMin:'Competitor pilot min',competitorConnectPilotMax:'Competitor pilot max',year3ConnectStrong:'Year 3 Connect strong ≥',year3CapacityStrong:'Year 3 Capacity strong ≥',year3ConnectPilotMin:'Year 3 pilot Connect min',year3ConnectPilotMax:'Year 3 pilot Connect max'};return `<section class="card full"><div class="meta">Calibration</div><h3>Budget and outcome thresholds</h3><p>Stored with this session and locked when it starts. Change these between sections without a deploy; existing sessions keep their own rules.</p><div class="thresholds">${Object.keys(L).map(k=>`<div class="field"><label>${esc(L[k])}</label><input class="th" data-k="${k}" type="number" step="1" min="0" max="${k==='budgetPerYear'||k==='runFloor'?30:k==='perLineCap'?6:12}" value="${Number(t[k]??0)}" ${s.state!=='lobby'?'disabled':''}></div>`).join('')}</div><div class="actions"><button class="btn" id="saveCal" ${s.state!=='lobby'?'disabled':''}>Save calibration</button></div>${notice('Year 3 treats strong Connect with sub-strong Capacity as its own authored outcome: Data without room to run it.')}</section>`}
function readiness(s){const t=s.thresholds||state.defaultThresholds||{};return `<section class="card full"><div class="meta">Classroom readiness</div><h3>Pilot calibration and debrief notes</h3><p>This session: $${t.budgetPerYear}M a year, Run minimum $${t.runFloor}M, other-line cap $${t.perLineCap}M. New sessions start with the provisional 9 / 4 / 3 pilot settings.</p><p>Ask students what they could justify from the briefing, which priorities they protected, and what they would change after the outcomes. A rare all-top-outcome allocation is not a correct answer or a grade.</p><p>The distribution across all mathematically legal allocations is not a prediction of this class. Judge the calibration after a facilitated pilot, not by assuming students choose randomly.</p><div class="notice"><b>Before class:</b> post the briefing packet and rehearse one Team-mode run with 2–3 devices, including runner handoff, completion reporting and the instructor console.</div></section>`}
function analytics(rs){return `<section class="card full" id="group-results"><div class="meta">Live group results</div><h2>What the room chose</h2><p class="lede">Debrief cue: the annual cap is the wall. Every million above Run displaced an architecture choice somewhere else.</p>${distribution(rs)}</section><section class="card"><div class="meta">Year 3 bands</div><h3>Where portfolios landed</h3>${bands(rs)}</section><section class="card"><div class="meta">Connect vs Uptime</div><h3>The argument in two axes</h3>${scatter(rs)}</section><section class="card full"><div class="meta">Buyer interest</div><h3>Three buyers, three different answers</h3>${buyerInterest(rs)}</section><section class="card full"><div class="meta">Contrasting runs</div><h3>Two anonymous positions side by side</h3>${contrast(rs)}</section><section class="card full"><div class="meta">Opening views + export</div><h3>What they said the company should become</h3>${sentences(rs)}<div class="actions"><button class="btn" id="export" ${rs.length?'':'disabled'}>Export CSV</button></div></section>`}
function distribution(rs){let q=rs.filter(r=>r.year1);if(!q.length)return notice('No Year 1 allocations submitted yet.');return `<div class="dist">${['run','uptime','capacity','connect','features'].map(k=>{let max=k==='run'?state.session.thresholds.budgetPerYear:state.session.thresholds.perLineCap,c=Array(max+1).fill(0);q.forEach(r=>c[r.year1[k]]++);let peak=Math.max(1,...c);return `<div class="drow"><div class="meta">${k}</div><div class="bars">${c.map((n,i)=>`<div class="bar" style="height:${Math.max(4,n/peak*48)}px"><b>${n||''}</b><span>${i}</span></div>`).join('')}</div></div>`}).join('')}</div>`}
function bands(rs){const c={strong:0,data_no_room:0,pilot:0,weak:0},labels={strong:'strong',data_no_room:'Data without room to run it',pilot:'pilot',weak:'weak'};rs.forEach(r=>{const b=r.outcomes?.year3?.band;if(Object.prototype.hasOwnProperty.call(c,b))c[b]++});return `<div class="bands">${Object.entries(c).map(([k,n])=>`<div class="band ${k==='data_no_room'?'data-room':''}"><span>${esc(labels[k])}</span><b>${n}</b></div>`).join('')}</div>`}
function buyerInterest(rs){const names=[['carrolton','Carrolton Systems'],['ridge_hollow','Ridge Hollow Partners'],['corven','Corven Building Systems']];const cards=names.map(([key,name])=>{const c={high:0,qualified:0,low:0};rs.forEach(r=>{const v=r.outcomes?.buyers?.[key]?.interest;if(v)c[v]=(c[v]||0)+1});return `<div class="runbox"><h4>${esc(name)}</h4>${['high','qualified','low'].map(k=>`<div class="interest-row"><span>${k}</span><b>${c[k]||0}</b></div>`).join('')}</div>`}).join('');const matches=rs.map((r,i)=>({r,i})).filter(x=>x.r.outcomes?.buyers?.corven?.interest==='high'&&x.r.outcomes?.buyers?.ridge_hollow?.interest==='low');return `<div class="buyer-dist">${cards}</div><div class="buyer-find"><div class="meta">Debate finder · Corven high / Ridge Hollow low</div>${matches.length?`<div class="actions">${matches.map(x=>`<button class="btn buyer-run" data-run="${esc(x.r.runId)}">Anonymous run ${x.i+1}</button>`).join('')}</div>`:'<p>No run has landed there yet.</p>'}</div>`}
function scatter(rs){const raw=rs.filter(r=>r.outcomes?.year3?.cumulative).map(r=>r.outcomes.year3.cumulative);if(!raw.length)return notice('No Year 3 outcomes yet.');const groups={};raw.forEach(c=>{const k=`${c.connect}:${c.uptime}`;(groups[k]||={c,n:0}).n++});const p=Object.values(groups);return `<div class="scatter"><span class="axis x">Cumulative Connect →</span><span class="axis y">Cumulative Uptime →</span>${p.map(x=>{const size=18+Math.min(34,(x.n-1)*6);return `<span class="dotcount" aria-label="${x.n} runs at Connect ${x.c.connect}, Uptime ${x.c.uptime}" style="width:${size}px;height:${size}px;left:${x.c.connect/(2*state.session.thresholds.perLineCap)*100}%;bottom:${x.c.uptime/(2*state.session.thresholds.perLineCap)*100}%">${x.n}</span>`}).join('')}</div>`}
function mini(a){return `<div class="mini">${['run','uptime','capacity','connect','features'].map(k=>`<div><b>${a[k]}</b><span>${k}</span></div>`).join('')}</div>`}function runBox(r,n){return r?`<div class="runbox"><div class="meta">Anonymous run ${n}</div><div class="sentence">${esc(r.strategicView||'No opening sentence submitted.')}</div>${r.year1?mini(r.year1):''}<p>Year 3: ${esc(r.outcomes?.year3?.band||'not reached')}</p></div>`:'<div class="runbox">—</div>'}
function contrast(rs){
 if(!rs.length)return notice('No runs available.');
 if(!rs.some(r=>r.runId===aSel))aSel=rs[0].runId;
 if(!rs.some(r=>r.runId===bSel))bSel=rs[Math.min(1,rs.length-1)].runId;
 const opts=selected=>rs.map((r,i)=>`<option value="${attr(r.runId)}" ${r.runId===selected?'selected':''}>Run ${i+1}</option>`).join('');
 const a=rs.find(r=>r.runId===aSel),b=rs.find(r=>r.runId===bSel);
 return `<div class="actions"><label>First run<select id="as">${opts(aSel)}</select></label><label>Second run<select id="bs">${opts(bSel)}</select></label></div><div class="contrast">${runBox(a,rs.indexOf(a)+1)}${runBox(b,rs.indexOf(b)+1)}</div>`;
}
function sentences(rs){
  const x=rs.filter(r=>r.strategicView);
  if(!x.length)return notice('No opening sentences submitted yet.');
  return `<div class="contrast">${x.map((r,i)=>`<div class="runbox"><div class="meta">Anonymous run ${i+1}</div><div class="sentence">${esc(r.strategicView)}</div>${r.year1?mini(r.year1):'<p>Year 1 not submitted.</p>'}</div>`).join('')}</div>`;
}
function startPresent(){const debrief=document.getElementById('fw-debrief');if(debrief)debrief.open=true;const cards=[...document.querySelectorAll('#app .card')].filter(x=>/Projector view|Year 3 bands|Connect vs Uptime|Buyer interest|Contrasting runs/.test(x.textContent));if(!cards.length)return;document.body.classList.add('present');presentIndex=Math.min(presentIndex,cards.length-1);const show=()=>{cards.forEach((c,i)=>c.classList.toggle('present-on',i===presentIndex))};show();const key=e=>{if(!document.body.classList.contains('present'))return;if(e.key==='Escape'){document.body.classList.remove('present');cards.forEach(c=>c.classList.remove('present-on'));document.removeEventListener('keydown',key);return}if(e.key==='ArrowRight'||e.key==='ArrowDown'){presentIndex=(presentIndex+1)%cards.length;show()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){presentIndex=(presentIndex-1+cards.length)%cards.length;show()}};document.addEventListener('keydown',key)}
render();
if(!BASE)fetch(BASE+'/api/platform').then(r=>r.ok?r.json():null).then(d=>{
  if(d&&/^https?:\/\//.test(d.platformUrl||'')){
    facultyDashboard=d.platformUrl.replace(/\/$/,'')+'/faculty.html';
    if(authProblem)render();
  }
}).catch(()=>{});
</script></body></html>
